[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solaris-gatekeeper"
version = "0.1.0"
description = "Solaris Wyoming bridge — Wyoming server that drives Whisper/Piper and hands off conversation to the Solaris Engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Dopp", email = "mdopp79@gmail.com" }]
dependencies = [
  # wyoming>=1.6 made `version` a required positional on AsrProgram /
  # AsrModel / TtsProgram. The previous `>=1.5.0` open pin meant fresh
  # image builds installed 1.9.x and the missing kwarg crashed every
  # connection (#1024). Pin to >=1.9 explicitly so the constructor
  # contract matches the call sites in __main__.py; widen back when a
  # 2.x release stabilises the shape.
  "wyoming>=1.9.0,<2.0",
  "httpx>=0.27",
  "aiohttp>=3.9",
  # Room set/list exposed to the Solaris Engine as a streamable-HTTP MCP tool server
  # (#104). uvicorn is pinned explicitly because the MCP server runs its
  # own ASGI app beside the aiohttp push server.
  # Capped below 2.0. The removed test helper
  # (mcp.shared.memory.create_connected_server_and_client_session) is the
  # visible symptom, not the reason: mcp 2.0 deletes the whole
  # `mcp.server.fastmcp` package this server is built on (FastMCP is now
  # mcp.server.mcpserver.MCPServer, `_mcp_server` is `_lowlevel_server`, and
  # the handler registry the #312 capability-trim pops from is keyed by
  # method string). That port is mechanical and verified against 2.0.0 —
  # what blocks it is the other end of the wire: mcp 2.0 also removed
  # `mcp.client.streamable_http.streamablehttp_client`, the helper the
  # Solaris Engine (solaris-chat, `mcp>=1.9` uncapped) uses to call this
  # server. Its CI is green only because those imports are function-local.
  # Lifting this cap alone would put a 2.x server behind a client that
  # cannot be built on 2.x, so the two move together or not at all (#1102).
  "mcp>=1.2,<3",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
test = [
  "pytest>=7",
  "pytest-asyncio>=0.23",
  "pytest-aiohttp>=1.0",
  "pytest-cov>=4",
  "numpy>=1.26",
]
# Phase-2 speaker-ID (#937). The stock gatekeeper image does NOT install
# these — SpeechBrain pulls in torch, which adds ~1 GB to the image and
# needs a separate CI build. Operators wanting Speaker-ID build a custom
# image with `pip install /app[speaker-id]` and set
# SOLARIS_SPEAKER_ID_ENABLED=1 in the wizard. With the deps absent the
# resolver short-circuits to DEFAULT_UID so the conversation pipeline
# stays unaffected.
speaker-id = [
  "speechbrain>=1.0",
  "torch>=2.1",
  "numpy>=1.26",
]

[project.scripts]
gatekeeper = "gatekeeper.__main__:main"

[project.urls]
Homepage = "https://github.com/mdopp/solarisbay"
Spec = "https://github.com/mdopp/solarisbay/blob/main/voice-gatekeeper/README.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gatekeeper*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
