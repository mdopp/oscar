apiVersion: v1
kind: Pod
metadata:
  name: pi-web
  labels:
    app: pi-web
  annotations:
    servicebay.label: "Coding Agent Web UI (PI WEB)"
    servicebay.schema-version: "1"
    servicebay.ports: "{{PI_WEB_PORT}}/tcp"
    # nginx + auth for the proxy host and Authelia forward-auth; llama because
    # the sessions have no model without llama-server; solaris because the
    # post-deploy hands the retired lease unit's window back to the engine.
    servicebay.dependencies: "nginx,auth,llama,solaris"
    # PI WEB answers /api/pi-web/runtime once the web process is up and has
    # reached its session daemon. ServiceBay can't substitute a variable inside
    # an annotation block scalar (#136), so the port is the literal default —
    # an operator changing PI_WEB_PORT must change this line too.
    servicebay.healthcheck: |
      url: http://127.0.0.1:8504/api/pi-web/runtime
      interval: 30s
      timeout: 5s
      startup_timeout: 5m
spec:
  # NO hostNetwork. ADR 0007 Decision 2's carve-out list is closed and a new
  # service does not join it by arguing its case; Decision 3 says needing a
  # loopback-bound sibling is not a carve-out either. So this pod runs in its
  # own netns, publishes 8504 as a hostPort, and reaches llama-server as
  # `host.containers.internal` — the sibling half of that pattern already
  # landed (#1344: llama binds 0.0.0.0 and LLAMA_PORT carries blockLanAccess),
  # which is what makes the isolated path answer at all.
  #
  # The one thing this pod therefore CANNOT reach is the Solaris Engine's
  # `/api/model-lease`: it is loopback-only by design (no token, reachability
  # is the authorisation) and the engine binds 127.0.0.1 alone. That is fine —
  # pi-web does not ask for a lease at all (#1392): it uses whatever model
  # llama-server currently serves, and Qwen is requested from the Solaris model
  # tile instead.
  restartPolicy: Always
  initContainers:
  # `DirectoryOrCreate` makes the host path owned by userns-root (the "core"
  # host UID maps to container UID 0), but both real containers below run as
  # the image's `USER node` — so sessiond's first write (claiming its state
  # socket under /data/pi-web) hit EACCES on every start, box-verified against
  # #1358 (crash loop, "mkdir '/data/pi-web': permission denied"). Same fix as
  # solaris/template.yml's notes-perms: open perms once, as userns-root, before
  # the non-root containers start.
  - name: pi-web-data-perms
    image: ghcr.io/mdopp/solaris-pi-web:latest
    command: ["chmod", "-R", "a+rwX", "/data", "/workspace"]
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    volumeMounts:
    - mountPath: /data
      name: pi-web-data
    - mountPath: /workspace
      name: pi-web-workspace

  # git-credentials — the only place in this pod where the git token exists.
  # It runs as the image's `USER node`, so the store file it writes is owned by
  # the UID the sessions run as and can be 0600; it has to come *after* the
  # perms init above, whose recursive `a+rwX` would otherwise reopen it on
  # every start. `sessiond` and `web` deliberately do NOT carry
  # PI_WEB_GIT_TOKEN: a session's own shell therefore cannot read the token out
  # of its environment, only use it through git. Nothing here puts the token in
  # argv, in a remote URL or on stdout — `sh -c` sees the variable's *name*.
  #
  # ServiceBay has no secret-mount mechanism: every secret in this repo reaches
  # its pod as a rendered `value:` (templates/solaris/template.yml does it for
  # HASS_TOKEN, PUSH_TOKEN, CALDAV_PASSWORD …), so the value is readable by
  # `podman inspect` for whoever can already run podman as the service user.
  # Confining it to this one short-lived init container is what that buys.
  - name: pi-web-git-credentials
    image: ghcr.io/mdopp/solaris-pi-web:latest
    env:
    - name: PI_WEB_GIT_TOKEN
      value: "{{PI_WEB_GIT_TOKEN}}"
    - name: PI_WEB_GIT_USER
      value: "{{PI_WEB_GIT_USER}}"
    - name: PI_WEB_GIT_HOST
      value: "{{PI_WEB_GIT_HOST}}"
    args:
    - sh
    - -c
    - |
      set -eu
      umask 077
      store=/data/pi-web/git-credentials
      config=/data/home/.gitconfig
      user=${PI_WEB_GIT_USER:-x-access-token}
      host=${PI_WEB_GIT_HOST:-github.com}
      mkdir -p /data/pi-web /data/home
      if [ -n "${PI_WEB_GIT_TOKEN:-}" ]; then
        printf 'https://%s:%s@%s\n' "$user" "$PI_WEB_GIT_TOKEN" "$host" >"$store"
        chmod 600 "$store"
      else
        rm -f "$store"
      fi
      unset PI_WEB_GIT_TOKEN
      git config --file "$config" --replace-all credential.helper "store --file=$store"
      git config --file "$config" --unset-all safe.directory || true
      git config --file "$config" --add safe.directory /workspace
      git config --file "$config" --add safe.directory '*'
    volumeMounts:
    - mountPath: /data
      name: pi-web-data

  # sb-token — the parent ServiceBay token `pi-web-project` delegates from
  # (#1395 slice C). ServiceBay mints it itself at install (`mintApiToken` on a
  # secret variable): read scope, never expiring, reused across re-installs.
  # Same shape and the same reason as the credential init above: it runs after
  # the perms init, as `USER node`, and writes a 0600 file rather than putting
  # the value in sessiond's environment where every session would read it.
  #
  # The `chmod` on the entries is not belt-and-braces: each project's entry file
  # and its bare token file hold that project's own token, they are written at
  # runtime, and the perms init's recursive `a+rwX` would reopen every one of
  # them on the next start.
  - name: pi-web-sb-token
    image: ghcr.io/mdopp/solaris-pi-web:latest
    env:
    - name: PI_WEB_SB_TOKEN
      value: "{{PI_WEB_SB_TOKEN}}"
    args:
    - sh
    - -c
    - |
      set -eu
      umask 077
      dir=/data/servicebay
      file=$dir/parent-token
      mkdir -p "$dir/projects"
      chmod 700 "$dir" "$dir/projects"
      if [ -n "${PI_WEB_SB_TOKEN:-}" ]; then
        printf '%s\n' "$PI_WEB_SB_TOKEN" >"$file"
        chmod 600 "$file"
      else
        rm -f "$file"
      fi
      unset PI_WEB_SB_TOKEN
      find "$dir/projects" -type f -exec chmod 600 {} +
    volumeMounts:
    - mountPath: /data
      name: pi-web-data

  # plugins — install the "Repo klonen" plugin (#1395 slice B) into the local
  # plugin root PI WEB scans, `$PI_WEB_DATA_DIR/plugins`. A plugin found there
  # is enabled unless the config disables it, so this copy IS the installation:
  # nothing has to be switched on under Settings → PI WEB plugins.
  #
  # It has to be a copy into /data rather than a mount from the image, because
  # the plugin root is scanned inside the volume PI WEB owns. `rm -rf` first is
  # deliberate and safe: the target is the directory this image put there, so a
  # file dropped from the plugin between versions does not linger and keep being
  # served. (That is the opposite of the repo's tombstone rule, which is about
  # ServiceBay's asset-transport — this path never goes through it.)
  #
  # The server half of a plugin is activated when `sessiond` starts, which is
  # why this runs as an init container: by the time sessiond comes up, the files
  # are already in place.
  - name: pi-web-plugins
    image: ghcr.io/mdopp/solaris-pi-web:latest
    args:
    - sh
    - -c
    - |
      set -eu
      dest=/data/pi-web/plugins
      mkdir -p "$dest"
      for plugin in /opt/solaris/pi-web-plugins/*/; do
        name=$(basename "$plugin")
        rm -rf "$dest/$name"
        cp -a "${plugin%/}" "$dest/"
      done
    volumeMounts:
    - mountPath: /data
      name: pi-web-data

  # agent-kit — ServiceBay delivers the assist catalog, its agent CLI and one
  # AGENTS.md to the box and this pod mounts all three read-only under
  # /opt/servicebay (#1398 slice A / servicebay#2903). Pi does not read them
  # where they lie: it loads skills from `$PI_CODING_AGENT_DIR/skills` as
  # Agent-Skills packages and its global context file from
  # `$PI_CODING_AGENT_DIR/AGENTS.md`. This step generates both from the mount.
  #
  # It runs on every start rather than once, because that is how a catalog
  # update reaches the sessions: ServiceBay refreshes the checkout hourly, and
  # the next start regenerates from whatever it now holds. Writing an unchanged
  # file is skipped, so a start with nothing new touches nothing.
  - name: pi-web-agent-kit
    image: ghcr.io/mdopp/solaris-pi-web:latest
    args: ["pi-web-agent-kit"]
    volumeMounts:
    - mountPath: /data
      name: pi-web-data
    - mountPath: /opt/servicebay/agent-cli
      name: agent-kit-cli
      readOnly: true
    - mountPath: /opt/servicebay/agent-docs
      name: agent-kit-docs
      readOnly: true
    - mountPath: /opt/servicebay/assists
      name: agent-kit-assists
      readOnly: true

  containers:
  # sessiond — the workspace authority: it owns the agent sessions, the
  # terminals and the model runtime, and keeps them alive across browser
  # disconnects. It talks to the web process over a unix socket on the shared
  # /data volume, so it publishes no port of its own.
  - name: sessiond
    image: ghcr.io/mdopp/solaris-pi-web:latest
    # `args`, not `command`: the image's ENTRYPOINT is tini, and a `command`
    # here would replace it and leave the sessions' children unreaped.
    args: ["pi-web-sessiond"]
    env:
    # Where `pi-web-project` reaches ServiceBay. The URL is not a credential and
    # the sessions inherit it from sessiond; the token deliberately does NOT
    # travel this way — it stays in the 0600 file the init above writes.
    - name: SERVICEBAY_API_URL
      value: "{{SERVICEBAY_API_URL}}"
    # Where the read-only agent kit is. The shipped AGENTS.md tells the model to
    # reach the catalog and the CLI through this variable rather than a
    # hard-coded path, so it has to be set wherever a session's shell runs.
    - name: SERVICEBAY_AGENT_KIT
      value: "/opt/servicebay"
    volumeMounts:
    - mountPath: /data
      name: pi-web-data
    - mountPath: /workspace
      name: pi-web-workspace
    - mountPath: /opt/servicebay/agent-cli
      name: agent-kit-cli
      readOnly: true
    - mountPath: /opt/servicebay/agent-docs
      name: agent-kit-docs
      readOnly: true
    - mountPath: /opt/servicebay/assists
      name: agent-kit-assists
      readOnly: true

  # web — the browser-facing HTTP/WebSocket surface. NPM proxies
  # {{PI_WEB_SUBDOMAIN}}.{{PUBLIC_DOMAIN}} down to the host port below behind
  # Authelia forward-auth; PI WEB itself has no login of its own (upstream is
  # explicit that it assumes trusted users), which is why PI_WEB_PORT carries
  # blockLanAccess and the proxy host is the only way in.
  - name: web
    image: ghcr.io/mdopp/solaris-pi-web:latest
    args: ["pi-web-server"]
    env:
    # 0.0.0.0 inside the pod's own netns — the pod is the boundary here, not
    # the bind address, and a loopback bind would make the hostPort unreachable.
    - name: PI_WEB_HOST
      value: "0.0.0.0"
    - name: PI_WEB_PORT
      value: "8504"
    # The host this is served under. Also the template's reference to
    # {{PUBLIC_DOMAIN}}: without one anywhere in this YAML the manifest
    # assembler never injects the global, and the subdomain's proxy host is
    # dropped with nothing in the install log (assist
    # footgun-subdomain-needs-public-domain).
    - name: PI_WEB_ALLOWED_HOSTS
      value: "{{PI_WEB_SUBDOMAIN}}.{{PUBLIC_DOMAIN}}"
    - name: SERVICEBAY_AGENT_KIT
      value: "/opt/servicebay"
    ports:
    - containerPort: 8504
      hostPort: {{PI_WEB_PORT}}
    volumeMounts:
    - mountPath: /data
      name: pi-web-data
    - mountPath: /workspace
      name: pi-web-workspace
    - mountPath: /opt/servicebay/agent-cli
      name: agent-kit-cli
      readOnly: true
    - mountPath: /opt/servicebay/agent-docs
      name: agent-kit-docs
      readOnly: true
    - mountPath: /opt/servicebay/assists
      name: agent-kit-assists
      readOnly: true

  # autoloop — Pi works tickets labelled {{PI_AUTOLOOP_LABEL}} headlessly
  # (#1398 slice B). Its own container rather than a thread inside sessiond:
  # a run is a `pi --mode json` subprocess with a hard time cap, and a crash
  # loop in it must not take the browser surface down with it.
  #
  # It deliberately does NOT carry PI_WEB_GIT_TOKEN — same rule as sessiond and
  # web. The token stays in the 0600 store the credential init wrote; git finds
  # it through the credential helper and the loop reads that same file for its
  # GitHub REST calls, so it reaches neither this container's environment nor
  # the environment `pi` is started with.
  - name: autoloop
    image: ghcr.io/mdopp/solaris-pi-web:latest
    args: ["pi-web-autoloop"]
    env:
    - name: PI_AUTOLOOP_ENABLED
      value: "{{PI_AUTOLOOP_ENABLED}}"
    - name: PI_AUTOLOOP_REPOS
      value: "{{PI_AUTOLOOP_REPOS}}"
    - name: PI_AUTOLOOP_LABEL
      value: "{{PI_AUTOLOOP_LABEL}}"
    - name: PI_AUTOLOOP_INTERVAL_S
      value: "{{PI_AUTOLOOP_INTERVAL_S}}"
    - name: PI_AUTOLOOP_TIME_CAP_S
      value: "{{PI_AUTOLOOP_TIME_CAP_S}}"
    # Which alias llama-server has loaded right now — read, never requested.
    # The loop holds no lease (#1392): Qwen comes from the Solaris model tile.
    - name: LLAMA_PORT
      value: "{{LLAMA_PORT}}"
    # The loop runs `pi` headlessly, so it loads the same global AGENTS.md and
    # the same generated skills as a browser session — and that file points at
    # this path. Without the mount here the context file would name a directory
    # that only exists in the other two containers.
    - name: SERVICEBAY_AGENT_KIT
      value: "/opt/servicebay"
    volumeMounts:
    - mountPath: /data
      name: pi-web-data
    - mountPath: /workspace
      name: pi-web-workspace
    - mountPath: /opt/servicebay/agent-cli
      name: agent-kit-cli
      readOnly: true
    - mountPath: /opt/servicebay/agent-docs
      name: agent-kit-docs
      readOnly: true
    - mountPath: /opt/servicebay/assists
      name: agent-kit-assists
      readOnly: true

  volumes:
  # PI WEB + Pi agent state: the project and machine registries, session
  # archives, the sessiond socket, and the Pi agent directory whose
  # models.json points the sessions at llama-server (written by post-deploy).
  - name: pi-web-data
    hostPath:
      path: {{DATA_DIR}}/pi-web/data
      type: DirectoryOrCreate
  # The repositories the agents work in. Separate from the state volume so a
  # backup can treat checked-out code and durable app state differently.
  - name: pi-web-workspace
    hostPath:
      path: {{DATA_DIR}}/pi-web/workspace
      type: DirectoryOrCreate
  # The ServiceBay agent kit, read-only. Three subdirectories of the delivered
  # checkout rather than the checkout root: the root also carries ServiceBay's
  # own repository files (its README, its CLAUDE.md, its package manifests), and
  # mounting those into a coding agent's container would put another project's
  # instructions in front of the one it is working on.
  #
  # `DirectoryOrCreate`, not `Directory`, on purpose: an older ServiceBay has
  # not delivered the kit yet, and a missing hostPath with `Directory` fails the
  # whole pod. An empty mount instead degrades to "the CLI is not there", which
  # `servicebay` says in one sentence naming the reason.
  - name: agent-kit-cli
    hostPath:
      path: {{PI_WEB_AGENT_KIT_DIR}}/agent-cli
      type: DirectoryOrCreate
  - name: agent-kit-docs
    hostPath:
      path: {{PI_WEB_AGENT_KIT_DIR}}/agent-docs
      type: DirectoryOrCreate
  - name: agent-kit-assists
    hostPath:
      path: {{PI_WEB_AGENT_KIT_DIR}}/assists
      type: DirectoryOrCreate
