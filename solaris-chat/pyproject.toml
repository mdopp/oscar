[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solaris-chat"
version = "0.1.0"
description = "Solaris household chat — the Solaris Engine agent core and its chat surface."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Dopp", email = "mdopp79@gmail.com" }]
dependencies = [
  "aiohttp>=3.9",
  # Official MCP SDK — the admin profile's servicebay_admin toolbox and the
  # client end of the gatekeeper's room tool server.
  # Capped below 2.0: mcp 2.0 removed
  # `mcp.client.streamable_http.streamablehttp_client`, which
  # engine/tools/mcp_tools.py imports at three call sites. Those imports are
  # function-local, so a 2.x install still imports, collects and passes the
  # suite — the ImportError only lands at runtime on the box, the first time
  # the engine tries to list or call an MCP tool. Green tests are not evidence
  # this pin is safe. Lifting the cap means porting both ends of the wire at
  # once, since voice-gatekeeper is capped the same way (#1102/#1106).
  "mcp>=1.9,<2",
  # Brute-force cosine over the OKF embedding vectors (float32 blobs); #650/#651.
  "numpy>=1.26",
  # Web Push (VAPID) for timer/reminder phone notifications (#713); no FCM.
  "pywebpush>=1.14",
  # Google-Takeout import core (epic #860, vendored from solaris-import-google):
  # icalendar parses Calendar .ics, vobject parses Contacts .vcf, mutagen reads
  # music-library tags, ytmusicapi resolves albums for the music shopping list.
  "icalendar>=6.1",
  "vobject>=0.9.9",
  "mutagen>=1.47",
  "ytmusicapi>=1.8.2",
]

[project.optional-dependencies]
test = [
  "pytest>=7",
  "pytest-asyncio>=0.23",
  "pytest-aiohttp>=1.0",
]

[project.scripts]
solaris-chat = "solaris_chat.__main__:main"

[project.urls]
Homepage = "https://github.com/mdopp/solarisbay"

[tool.setuptools.packages.find]
where = ["src"]
include = ["solaris_chat*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
solaris_chat = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
