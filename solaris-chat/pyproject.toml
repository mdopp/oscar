[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solaris-chat"
version = "0.1.0"
description = "Solaris household chat — the Solaris Engine agent core and its chat surface."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Dopp", email = "mdopp79@gmail.com" }]
dependencies = [
  "aiohttp>=3.9",
  # XXE/entity-expansion-hardened ElementTree for the two parsers that read
  # network-sourced XML: DAV multistatus responses and podcast RSS feeds (#1225).
  "defusedxml>=0.7",
  # Official MCP SDK — the admin profile's servicebay_admin toolbox and the
  # client end of the gatekeeper's room tool server. On the 2.x line (#1106):
  # the transport helper is `streamable_http_client`, it takes an
  # `httpx2.AsyncClient` instead of `headers=`, and it yields a 2-tuple.
  # Capped below 3.0 because engine/tools/mcp_tools.py imports it at three
  # function-local call sites, so a breaking rename passes CI and only fails
  # on the box the first time the engine lists or calls an MCP tool.
  "mcp>=2,<3",
  # Brute-force cosine over the OKF embedding vectors (float32 blobs); #650/#651.
  "numpy>=1.26",
  # Web Push (VAPID) for timer/reminder phone notifications (#713); no FCM.
  "pywebpush>=1.14",
  # Google-Takeout import core (epic #860, vendored from solaris-import-google):
  # icalendar parses Calendar .ics, vobject parses Contacts .vcf, mutagen reads
  # music-library tags, ytmusicapi resolves albums for the music shopping list.
  "icalendar>=6.1",
  "vobject>=0.9.9",
  "mutagen>=1.47",
  "ytmusicapi>=1.8.2",
]

[project.optional-dependencies]
test = [
  "pytest>=7",
  "pytest-asyncio>=0.23",
  "pytest-aiohttp>=1.0",
  # test_mcp_transport.py serves a real MCP server so the function-local
  # client imports are exercised by CI (#1106).
  "uvicorn>=0.27",
]

[project.scripts]
solaris-chat = "solaris_chat.__main__:main"

[project.urls]
Homepage = "https://github.com/mdopp/solarisbay"

[tool.setuptools.packages.find]
where = ["src"]
include = ["solaris_chat*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
solaris_chat = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
