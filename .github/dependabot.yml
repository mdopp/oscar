# Dependency-update PRs (gates 1+4). pip ecosystems for the two installable
# Python projects, plus the GitHub Actions used in the workflows. Grouped to
# keep PR volume low (design pref: few knobs). The autoloop routes these PRs
# as a filler track; security updates surface even between schedules.
version: 2
updates:
  - package-ecosystem: pip
    directory: /voice-gatekeeper
    schedule:
      interval: weekly
    groups:
      gatekeeper-deps:
        patterns: ["*"]
    ignore:
      # The `mcp<3` cap is a guard, not a stale pin: every mcp major so far has
      # renamed the server/client entrypoints this repo uses, and the engine's
      # half of the wire imports them FUNCTION-LOCALLY — so a bad bump keeps CI
      # green and only breaks at runtime on the box. A major goes in by hand,
      # both ends together, with a real-box verify (#1102/#1106).
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /database
    schedule:
      interval: weekly
    groups:
      database-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
