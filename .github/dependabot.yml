# Dependency-update PRs (gates 1+4). pip ecosystems for the two installable
# Python projects, plus the GitHub Actions used in the workflows. Grouped to
# keep PR volume low (design pref: few knobs). The autoloop routes these PRs
# as a filler track; security updates surface even between schedules.
version: 2
updates:
  - package-ecosystem: pip
    directory: /voice-gatekeeper
    schedule:
      interval: weekly
    groups:
      gatekeeper-deps:
        patterns: ["*"]
    ignore:
      # The `mcp<2` cap is a guard, not a stale pin. mcp 2.0 replaced
      # `mcp.server.fastmcp` with `MCPServer` and dropped
      # `mcp.client.streamable_http.streamablehttp_client`, which solaris-chat
      # imports FUNCTION-LOCALLY at three sites — so CI stays green and the
      # break only appears at runtime on the box. Lifting the cap is tracked in
      # #1106 and waits on mdopp/servicebay#2437; until then a bump PR here can
      # only be wrong, and #1111 was closed for exactly this reason.
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /database
    schedule:
      interval: weekly
    groups:
      database-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
