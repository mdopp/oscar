name: build-images

# Build and publish container images for Solaris.
#
# - On push to `main`: builds + pushes to GHCR (path-filtered).
# - On pull requests touching image sources: builds without pushing,
#   so Dockerfiles are validated before merge.
# - On workflow_call: release-images.yml calls this for every `v*` tag.
# - On workflow_dispatch: builds + pushes for the dispatched ref (branch or tag).
#   Use `gh workflow run build-images.yml --ref vX.Y.Z` to manually publish
#   a versioned release (replaces the delete+repush workaround for #256).
#
# There is deliberately NO `tags:` entry in the `push` trigger below (#1275).
# A `paths:` filter applies to the whole `push` block, tag pushes included, so a
# release whose diff happened to touch none of the image sources would have built
# nothing at all. Tags therefore come in through release-images.yml, which has no
# path filter and cannot acquire one.
#
# `:latest` is moved by a push to `main` and by nothing else — see the tags step.

on:
  push:
    branches: [main]
    paths:
      - 'voice-gatekeeper/**'
      - 'database/**'
      - 'solaris-chat/**'
      - 'tts-martin/**'
      - 'wakeword-trainer/**'
      - 'pi-web/**'
      - '.github/workflows/build-images.yml'
  pull_request:
    paths:
      - 'voice-gatekeeper/**'
      - 'database/**'
      - 'solaris-chat/**'
      - 'tts-martin/**'
      - 'wakeword-trainer/**'
      - 'pi-web/**'
      - '.github/workflows/build-images.yml'
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build. Defaults to the caller ref (the tag).'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch or tag, e.g. v0.3.0). Defaults to the ref selected when running the workflow.'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write

# Two runs building the same ref must not overlap: each pushes its own tags per
# image, so with both in flight whichever finishes an image LAST wins it and
# `:latest` ends up a mix of commits ACROSS images — that is how the box got a
# new gatekeeper against an old schema (#1110). Grouping by the ref actually
# built serialises the main-push builds (the only runs that move `:latest`) and
# leaves a release-tag build in its own group, where no main push can queue
# behind or cancel it. cancel-in-progress only for pull_request runs: they push
# nothing, so dropping a superseded one is free, while cancelling a publishing
# run mid-flight would leave some images pushed and others not.
concurrency:
  group: build-images-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: solaris-gatekeeper
            context: voice-gatekeeper
            description: "Solaris Wyoming bridge — STT/TTS pipeline orchestration, Phase-2 speaker ID. Runs as a container inside the SolarisBay pod; reaches ServiceBay's voice template via host loopback (both pods hostNetwork)."
          - image: solaris-gatekeeper-ml
            context: voice-gatekeeper
            build_args: |
              EXTRAS=[speaker-id]
            description: "Solaris gatekeeper with Phase-2 speaker-ID baked in (SpeechBrain + torch / ECAPA). Same bridge as solaris-gatekeeper; use this image and set SOLARIS_SPEAKER_ID_ENABLED=true to resolve the speaking resident per turn. Larger image (torch); biometric."
          - image: solaris-schema-init
            context: database
            description: "Solaris schema-init sidecar — runs alembic upgrade head against the SolarisBay pod's local SQLite (solaris.db) on every pod start. Idempotent."
          - image: solaris-tts
            context: tts-martin
            description: "Solaris's voice — Kokoro-82M ONNX German single speaker Martin (Apache-2.0, vendored from Godelaune/Kokoro-82M-ONNX-German-Martin with the model baked in). OpenAI-compatible /v1/audio/speech on :8881; KOKORO_ONNX_PROVIDER=cuda puts the 82M model on the GPU."
          - image: solaris-chat
            context: solaris-chat
            inject_version: true
            description: "Solaris chat — the Solaris Engine agent core (direct llama-server agent loop, HA tools, scheduler, crons) with its chat surface and the Ollama-protocol facade for HA Assist. Reads the Authelia Remote-User header for SSO; holds SOLARIS_API_KEY server-side."
          - image: solaris-pi-web
            context: pi-web
            description: "PI WEB — the web UI for the Pi Coding Agent (@jmfederico/pi-web), built here because upstream publishes an npm package and no image. Runs isolated on the box behind Authelia; talks to llama-server over host.containers.internal and holds the coding lease while it is up."
          - image: solaris-wakeword-trainer
            context: wakeword-trainer
            # TensorFlow-GPU base: ~10 GB unpacked, well past the 10 GB the GHA
            # layer cache holds for the whole repo, so caching it would evict
            # every other image's cache for no gain.
            skip_layer_cache: true
            description: "Solaris wakeword trainer — the GPU companion that claims queued wakeword_training_runs and trains the on-device microWakeWord \"Solaris\" model (TensorFlow 2.18-gpu + microWakeWord + piper-sample-generator). Runs as a CDI GPU Quadlet beside whisper/Kokoro; produces the streaming .tflite + ESPHome manifest, flashing stays a separate phase."
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history + tags so `git describe --tags` can compute the
          # SOLARIS_VERSION badge value (shallow checkout sees no tags).
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Check Dockerfile exists
        id: check
        run: |
          if [ -f "${{ matrix.context }}/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${{ matrix.context }}/Dockerfile not present on this ref; skipping ${{ matrix.image }} build."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.check.outputs.exists == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        if: steps.check.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # Two independent paths can publish `latest`, and #1110's first fix
          # closed only one. metadata-action's default flavor is `latest=auto`,
          # which appends `latest` on its own whenever a semver/pep440/match rule
          # or a tag ref matches — that is how the v0.37.0 dispatch published
          # `latest` while the raw rule below was correctly `enable=false`.
          # `latest=false` gates that auto path off; the explicit `type=raw`
          # value is unaffected (it is a literal tag value, not the auto flag),
          # so the rule below stays the single source of truth. prefix/suffix
          # keep their empty defaults — unlisted flavor keys are untouched.
          flavor: latest=false
          # `latest` is what the box pulls, so only a push to main may move it.
          # `github.ref` alone is not enough: on workflow_dispatch it is the ref
          # the run was STARTED from, not the ref checked out via inputs.ref, so a
          # UI dispatch of an old tag (selected ref main + inputs.ref=vX.Y.Z) used
          # to publish that old build as `latest` (#1110). Requiring event_name
          # == push makes every dispatch ineligible whatever ref it built; the
          # release-tag dispatch in release-please.yml never claimed it either.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', 'main') }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Compute version
        if: steps.check.outputs.exists == 'true' && matrix.inject_version
        id: version
        run: |
          # git-describe yields the clean tag on a tag build (e.g. v0.3.0) and a
          # tag-relative descriptor on main (e.g. v0.2.0-12-ga6e9164). Strip the
          # leading 'v' — the badge prepends its own, so 'main' would show 'vmain'
          # but '0.2.0-12-g...' shows 'v0.2.0-12-g...'.
          echo "v=$(git describe --tags --always | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - name: Build (and push on main/tags)
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          build-args: |
            ${{ matrix.build_args }}
            ${{ matrix.inject_version && format('SOLARIS_VERSION={0}', steps.version.outputs.v) || '' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The skip flag has to be on the TRUE branch: `flag && '' || cache`
          # never skips, because the empty string is falsy and falls through to
          # the right-hand side.
          cache-from: ${{ matrix.skip_layer_cache != true && format('type=gha,scope={0}', matrix.image) || '' }}
          cache-to: ${{ matrix.skip_layer_cache != true && format('type=gha,mode=max,scope={0}', matrix.image) || '' }}
          platforms: linux/amd64
