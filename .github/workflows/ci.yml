name: ci

# Lint + test + scan the Python in Solaris (the solaris-chat engine, voice-gatekeeper
# bridge, database/alembic, ServiceBay post-deploy scripts). Image builds
# live in build-images.yml; template-/skill-/docs-only changes are gated by
# real-box /verify, not CI.
#
# The path filter covers `.github/workflows/**`, not just this file: the static
# assertions in templates/tests are the only guard over the release→image
# trigger chain (#1275), and a guard that doesn't run when its subject changes
# is decoration.

on:
  pull_request:
    paths:
      - '**/*.py'
      - '**/pyproject.toml'
      - 'ruff.toml'
      - '.pre-commit-config.yaml'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'solaris-chat/**/static/**'
      - 'solaris-chat/.importlinter'
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - '**/pyproject.toml'
      - 'ruff.toml'
      - '.pre-commit-config.yaml'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'solaris-chat/**/static/**'
      - 'solaris-chat/.importlinter'

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff==0.15.12
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: pytest + diff-coverage (voice-gatekeeper)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # full history + main ref so check-diff-coverage.py can diff vs the merge base
          fetch-depth: 0
      - run: git fetch origin main:refs/remotes/origin/main || true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e '.[test]'
        working-directory: voice-gatekeeper
      - run: pytest -q --cov=gatekeeper --cov-report=xml
        working-directory: voice-gatekeeper
      # Gate 2: new-code coverage only (changed gatekeeper lines ≥ floor). No-op
      # when a PR changes no gatekeeper source. Ratchet the floor up in the script.
      - run: python scripts/check-diff-coverage.py

  test-solaris-chat:
    name: pytest (solaris-chat)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solaris-chat
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e '.[test]'
      - run: pytest -q

  import-linter:
    name: import-linter (solaris-chat)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solaris-chat
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Editable install so grimp can resolve solaris_chat's real import graph.
      # Architecture-invariants ratchet (issue #1038): the contracts in
      # solaris-chat/.importlinter start permissive and only tighten over time.
      - run: pip install -e . import-linter
      - run: lint-imports

  test-templates:
    name: pytest (templates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Post-deploy scripts are stdlib-only and loaded via importlib; pyyaml is
      # only there for the static assertions over the workflow/pod YAML. Guards
      # the solaris/solarisbay post-deploy logic (SB-MCP token self-heal, SOUL.md
      # provisioning) and the build-images `:latest` rule — neither is exercised
      # anywhere else in CI.
      - run: pip install pytest pyyaml
      - run: pytest -q templates/tests

  test-database:
    name: pytest (database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # database/pyproject.toml declares requires-python >= 3.12.
          python-version: "3.12"
      # The alembic-in-the-loop migration tests. Nothing ran them in CI, so the
      # head assertions in 0022/0023 had silently rotted red on main; running
      # them here is what keeps a broken migration chain from reaching a box.
      - run: pip install -e '.[test]'
        working-directory: database
      - run: pytest -q
        working-directory: database

  test-wakeword-trainer:
    name: pytest (wakeword-trainer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # The queue worker is stdlib-only — TensorFlow lives in the image and is
      # reached through a subprocess. pyyaml is the training script's only
      # import beyond the stdlib, and the dataset tests (#1074) import it.
      # Guards the engine↔trainer handshake (#1066): an exactly-once claim and a
      # terminal write-back are the whole capability.
      - run: pip install pytest pyyaml
      - run: pytest -q wakeword-trainer/tests

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    # Gate 1: static security scan. Blocking as of #1255 — the baseline is clean
    # (the two accepted use-defused-xml findings in scripts/check-diff-coverage.py
    # carry a documented `# nosemgrep`), and report-only had left this job red on
    # every PR for findings nobody intended to act on, which trains everyone to
    # ignore it. The version is pinned so a new semgrep release can't wedge every
    # open PR on its own; bump it deliberately, like ruff above.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install semgrep==1.174.0
      - run: semgrep scan --config p/python --config p/security-audit --severity ERROR --error --metrics off

  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    # Gates 1+4: CVE scan of declared deps. Blocking as of #1224 — the baseline
    # is clean, and a report-only run of this job had never audited anything
    # (it aborted at the database install under the wrong Python, red but
    # ignored). Dependabot (.github/dependabot.yml) opens the update PRs the
    # autoloop routes as a filler track.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # database/pyproject.toml declares requires-python >= 3.12.
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip install -e .
        working-directory: voice-gatekeeper
      - run: pip install -e .
        working-directory: database
      - run: pip-audit --desc
