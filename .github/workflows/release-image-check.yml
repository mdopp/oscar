name: release-image-check

# Makes a release that ended without images LOUD (#1275).
#
# The two traps in the release pipeline (a `paths:` filter that also swallowed
# tag pushes, and release-please's GITHUB_TOKEN which starts no workflow at all)
# both fail the same way: the tag is cut, the CHANGELOG reads fine, and GHCR
# simply holds nothing for that version. Nobody finds out until the next deploy.
# In mdopp/foundry-chronicle#309 that was days.
#
# So the check runs on a clock rather than on someone remembering: every day it
# compares the recent `v*` tags against the images the build matrix would have
# produced for them, and files an issue when any are missing. An issue is a
# channel the autoloop already reads, so a silent release becomes queued work.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Space-separated tags to check (default: the newest ones).'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags: the script resolves tags and reads each tag's
          # tree to decide which images that release was supposed to produce.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: pip install pyyaml

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check published images
        id: check
        continue-on-error: true
        env:
          # Via env, never interpolated into the script body: a `${{ }}` input
          # spliced into `run:` is a shell-injection hole. Unquoted on purpose —
          # the input is a space-separated tag list.
          TAGS: ${{ inputs.tags }}
        run: |
          set -o pipefail
          # shellcheck disable=SC2086
          python scripts/check-release-images.py $TAGS | tee report.txt
          {
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: File an issue when images are missing
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'Release ohne Images in GHCR'
        run: |
          {
            echo "Der taegliche Abgleich hat Release-Tags gefunden, zu denen in GHCR"
            echo "kein Image liegt. Ein solcher Tag ist nicht ausrollbar."
            echo
            echo '```'
            cat report.txt
            echo '```'
            echo
            echo "Lauf: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Hintergrund: #1275 — ein mit GITHUB_TOKEN erzeugter Tag loest keinen"
            echo "Workflow aus. Solange RELEASE_PLEASE_TOKEN nicht existiert, haengt der"
            echo "Tag-Bau am Behelfs-Dispatch in release-please.yml."
          } > body.md
          existing=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$TITLE" --label bug --body-file body.md
          fi

      - name: Fail the run
        if: steps.check.outcome == 'failure'
        run: exit 1
